<!DOCTYPE html>
<html lang="en">

<head>
  <title> Landing page </title>
  <style>
    body {
      font-family: Verdana, Geneva, Tahoma, sans-serif;
      margin-left: 200px;
      margin-right: 200px;

      background-color: #CFC0FC;
    }

    #sidebar {
      border: 2px solid black;
      margin-bottom: 10vw;
      top: 50%;
      transform: translateY(-50%);
      padding: 20px;
      width: 200px;
      background-color: white;
      position: fixed;
      height: 600px; /* make this semi adjustable later */
      overflow: auto;

      background-image: radial-gradient(#CFC0FC 1px, transparent -50%);
      background-size: 3px 3px;
  
    }

    #sidebar a.active {
      background-color: #CFC0FC;
      color: black;
    }

    #sidebar a:hover:not(.active) {
      background-color: #656565;
      color: white;
    }
    
    #sidebar a {
      border: 2px solid black;
      margin-top: 20px;
      display: block;
      color: black;
      padding: 16px;
      text-decoration: none;
      background-color: white;
    
    }

    .about-me-box {
      margin-top: 20px;
      margin-bottom: 20px;
      height: 100px;

      background-color: rgba(255, 255, 255, 0.75);
    }

    .avatar-box {
      border: 2px solid black;
      margin-bottom: 20px;
      aspect-ratio: 1 / 1;
      align-self: center;
      align-content: center;
      text-align: center;
      overflow: hidden;

      background-image: url("asa_pfp.png");
      background-color: #CFC0FC;
      background-blend-mode: luminosity;
      background-size: 110%;
      background-position: center;
    }

    .avatar-box:hover:not(.active) {
      background-blend-mode: difference;
      color: white;
    }

    .content {
      border: 2px solid black;
      padding: 20px;
      margin-left: 280px;
      background-color: rgb(214, 214, 214);
      height: clamp(200px, 75vw, 90vh);
      overflow: auto;
      margin-bottom: 40px;
      aspect-ratio: 257 / 364;
    }

    .horizontal-panel {
      border: 2px solid black;
      padding: 20px;
      background-color: white;
      height: 280px;
      overflow: auto;
    }
    
    :root {
      color-scheme: light dark;
    }

  </style>

</head>
<body>
  <div id="sidebar">
    <div class = avatar-box></div>
    <div class = "about-me-box"></div>
    <a class="active" href="index.html">Home</a>
    <a href="interests.html">Interests</a>
    <a href="projects.html">Projects</a>
  </div>

  <div class = "content">
    <div class = "horizontal-panel"><p>content</p></div>
  </div>

   <div class = "content">
    <div class = "horizontal-panel"><p>content</p></div>
  </div>

</body>
</html>
