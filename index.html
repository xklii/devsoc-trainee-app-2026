<head>
  <title> Landing page </title>
  <style>
    body {
      font-family: Verdana, Geneva, Tahoma, sans-serif;
      margin: 5vw;
      background-color: #CFC0FC;
    }

    #sidebar {
      border: 2px solid black;
      margin-bottom: 10vw;
      
      padding: 20px;
      width: 200px;
      background-color: white;
      position: fixed;
      height: 100%;
      overflow: auto;
    }

    #sidebar a.active {
      background-color: #CFC0FC;
      color: black;
    }

    #sidebar a:hover:not(.active) {
      background-color: #656565;
      color: white;
    }
    
    #sidebar a {
      border: 2px solid black;
      margin-top: 20px;
      display: block;
      color: black;
      padding: 16px;
      text-decoration: none;
      background-color: white;
    
    }

    .avatar-box {
      height: (200 - 20 * 2)px;
      border: 2px solid black;
      margin-bottom: 20px;
      aspect-ratio: 1 / 1;
      align-self: center;
      align-content: center;
      text-align: center;
      overflow: hidden;
    }

    .avatar-box img {
      max-width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
      object-position: center top;
    }



    .content {
      border: 2px solid black;
      padding: 20px;
      margin-left: 280px;
      background-color: white;
      height: clamp(300px, 80vw, 100vh);
      overflow: auto;
    }
  </style>

</head>
<body>

  <div id="sidebar">
    <div class = avatar-box>
      <img src="asa_pfp.png" alt="haiiiii :3">
    </div>
    <a class="active" href="index.html">Home</a>
    <a href="interests.html">Interests</a>
    <a href="projects.html">Projects</a>
  </div>

  <div class = content>
    <p> welcome all </p>
  </div>

</body>
</html>
